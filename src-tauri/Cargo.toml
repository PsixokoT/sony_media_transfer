[package]
name = "sony-transfer"
version = "0.1.0"
description = "Copies photos and videos from a Sony A7 IV"
authors = ["PsixokoT"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "sony_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
